  <text x="928" y="347" font-size="10.5" fill="#b3bac4" text-anchor="middle">移除标签</text>
  <rect x="1120" y="328" width="88" height="30" rx="7" fill="#2f6fd0"/>
  <text x="1164" y="347" font-size="10.5" font-weight="600" fill="#eef4ff" text-anchor="middle">保存</text>

  <!-- ===== 右下：实现要点 ===== -->
  <rect x="856" y="412" width="384" height="424" rx="14" fill="#111419" stroke="#232833"/>
  <text x="874" y="440" font-size="12.5" font-weight="600" fill="#e6eaf0">实现要点 · client 半 + localStorage</text>

  <g font-size="10.2" fill="#a9b0bb">
    <circle cx="880" cy="470" r="7" fill="#1c2230" stroke="#2f3644"/>
    <text x="880" y="473.5" font-size="8" fill="#8fb4ff" text-anchor="middle">1</text>
    <text x="896" y="474">存储：hestia-session-labels → { id: { text, color } }</text>
    <text x="896" y="489" fill="#7d8590">与 hestia-session-colors 并列，互不覆盖</text>

    <circle cx="880" cy="516" r="7" fill="#1c2230" stroke="#2f3644"/>
    <text x="880" y="519.5" font-size="8" fill="#8fb4ff" text-anchor="middle">2</text>
    <text x="896" y="520">交互：hover 行追加「标签」按钮（排在置顶 / 颜色之后）</text>
    <text x="896" y="535" fill="#7d8590">点击开弹层：输入文案 + 选色，保存即刷新列表</text>

    <circle cx="880" cy="562" r="7" fill="#1c2230" stroke="#2f3644"/>
    <text x="880" y="565.5" font-size="8" fill="#8fb4ff" text-anchor="middle">3</text>
    <text x="896" y="566">渲染：标题节点前插入颜色点 +【文案】胶囊；</text>
    <text x="896" y="581" fill="#7d8590">React 重渲染后由 MutationObserver 兜底恢复</text>

    <circle cx="880" cy="608" r="7" fill="#1c2230" stroke="#2f3644"/>
    <text x="880" y="611.5" font-size="8" fill="#8fb4ff" text-anchor="middle">4</text>
    <text x="896" y="612">排序：仅「按工作区」生效；组内有标签在前，</text>
    <text x="896" y="627" fill="#7d8590">按标签文案 locale 升序，无标签置底</text>

    <circle cx="880" cy="654" r="7" fill="#1c2230" stroke="#2f3644"/>
    <text x="880" y="657.5" font-size="8" fill="#8fb4ff" text-anchor="middle">5</text>
    <text x="896" y="658">持久：折叠态只渲染前 5 条，DOM 重排无效 →</text>
    <text x="896" y="673" fill="#7d8590">用 workspaces.insertSessionBefore 写回 host（同 pin）</text>

    <circle cx="880" cy="700" r="7" fill="#1c2230" stroke="#2f3644"/>
    <text x="880" y="703.5" font-size="8" fill="#8fb4ff" text-anchor="middle">6</text>
    <text x="896" y="704">兼容：与「按标识颜色分组」同属 groupBy，天然互斥；</text>
    <text x="896" y="719" fill="#7d8590">blank / 无标签会话、悬停卡、置顶逻辑不变</text>
  </g>

  <rect x="872" y="736" width="352" height="84" rx="10" fill="#14171c" stroke="#3a3f49" stroke-dasharray="5 4"/>
  <text x="888" y="760" font-size="10.5" font-weight="600" fill="#e0b341">待确认（影响实现细节）</text>
  <text x="888" y="780" font-size="9.8" fill="#9aa3ae">① 排序键：标签文案 locale 升序，还是自定义标签序号？</text>
  <text x="888" y="800" font-size="9.8" fill="#9aa3ae">② 标签颜色按会话存，还是同标签文案全局统一色？</text>

  <!-- ===== 页脚 ===== -->
  <text x="40" y="872" font-size="9.5" fill="#5f6672">图 1 · Hestia 会话标签布局提案（示意尺寸，非最终像素）</text>
